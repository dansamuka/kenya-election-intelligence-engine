name: Notify VoteWatch of poll changes
on:
  push:
    branches: [main]
    paths:
      - 'data/foundation/polls_normalized.json'
      - 'data/foundation/poll_results_long.json'
      - 'data/manual_sources/**'
      - 'data/polls_data.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VoteWatch only for polling updates
        env:
          VOTEWATCH_TOKEN: ${{ secrets.VOTEWATCH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$VOTEWATCH_TOKEN" ]; then
            echo "::error::Missing VOTEWATCH_DISPATCH_TOKEN secret."
            exit 1
          fi
          curl --fail-with-body --retry 3 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $VOTEWATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dansamuka/votewatch/dispatches \
            -d '{"event_type":"election-engine-polls-updated"}'
