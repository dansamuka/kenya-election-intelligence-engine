name: Update Kenya Polls Data

on:
  schedule:
    # Runs every Monday at 06:00 UTC. GitHub Actions runners have normal
    # internet access, unlike the sandbox this pipeline was originally
    # built in, so the scraper steps below can actually reach pollster
    # websites here even though they could not during development.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run source discovery and extraction
        run: python backend/poll_tracker.py
        continue-on-error: true

      - name: Run source ingestion audit
        run: python backend/source_ingestion.py
        continue-on-error: true

      - name: Run data foundation build
        run: python backend/data_foundation.py
        continue-on-error: true

      - name: Rebuild polling model
        run: python backend/polling_model.py

      - name: Commit changes if any
        id: commit_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Automated data refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request VoteWatch synchronization
        if: steps.commit_data.outputs.changed == 'true'
        env:
          VOTEWATCH_TOKEN: ${{ secrets.VOTEWATCH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$VOTEWATCH_TOKEN" ]; then
            echo "::warning::Configure VOTEWATCH_DISPATCH_TOKEN to activate cross-repository synchronization."
            exit 0
          fi
          curl --fail-with-body --retry 3 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $VOTEWATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dansamuka/votewatch/dispatches \
            -d '{"event_type":"election-engine-polls-updated"}'
